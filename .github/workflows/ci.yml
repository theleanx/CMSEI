name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: mse, POSTGRES_PASSWORD: mse, POSTGRES_DB: mse}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mse" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - name: Migrations apply and match the models on Postgres
        env: {DATABASE_URL: "postgresql://mse:mse@localhost:5432/mse"}
        run: |
          alembic upgrade head
          alembic check
      - name: Docker image builds
        run: docker build -t mse .
